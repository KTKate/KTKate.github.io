name: Verify portfolio
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run sync
      - run: npm run build
      - run: npm test
      - run: npm run test:webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-verification
          path: |
            artifacts/qa/
            public/portfolio.pdf
